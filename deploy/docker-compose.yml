services:
  gateway:
    build:
      context: ../..
      dockerfile: finventory-ui/deploy/Dockerfile.gateway
      args:
        STOREFRONT_API_URL: /api/v1
        BACKOFFICE_API_URL: /api/v1
    depends_on:
      backend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      ADMIN_DOMAIN: ${APP_ADMIN_DOMAIN}
      ACME_EMAIL: ${APP_ACME_EMAIL}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  backend:
    build:
      context: ../..
      dockerfile: finventory-ui/deploy/Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: ${SPRING_FLYWAY_VALIDATE_ON_MIGRATE:-true}
      SERVER_PORT: ${SERVER_PORT}
      JAVA_OPTS: ${JAVA_OPTS}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD}
      APP_BOOTSTRAP_ADMIN_FIRSTNAME: ${APP_BOOTSTRAP_ADMIN_FIRSTNAME}
      APP_BOOTSTRAP_ADMIN_LASTNAME: ${APP_BOOTSTRAP_ADMIN_LASTNAME}
      APP_BOOTSTRAP_ADMIN_TENANTID: ${APP_BOOTSTRAP_ADMIN_TENANTID}
      APP_MAIL_FROM: ${APP_MAIL_FROM}
      APP_SECURITY_CORS_ALLOWED_ORIGINS: ${APP_SECURITY_CORS_ALLOWED_ORIGINS}
      APP_STOREFRONT_BASE_DOMAIN: ${APP_STOREFRONT_BASE_DOMAIN}
      APP_ADMIN_DOMAIN: ${APP_ADMIN_DOMAIN}
      APP_STOREFRONT_VERIFICATION_TARGET: ${APP_STOREFRONT_VERIFICATION_TARGET}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE}
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
